<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/poll-form.css">
    <title>HTML Form - User Poll</title>
</head>
<body>

    <header>
        <h1>WDD 130 | HTML - User Poll</h1>
    </header>
    
    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <div class="form-item column2">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <div class="form-item column2">
                    <label for="email">Email Address:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>  
            </fieldset>

            <fieldset>
                <legend>Questions</legend>
                <div class="form-item column1">
                    <label for="quantity">What is your favorite internet browser?</label>
                    <select name="browser" id="browser">
                        <option value="chrome">Chrome</option>
                        <option value="safari">Safari</option>
                        <option value="firebox">Firefox</option>
                        <option value="edge">Edge</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-item column1">
                    <label><input type="checkbox" name="pet" id="pet">Do you have a household pet?</label>
                </div>

                <div class="form-item">
                    <label for="message">List the places you have lived</label>
                    <textarea name="feedback" id="feedback" rows="5" placeholder="Delta Nigeria, Kumasi Ghana, Johannesburg South Africa"></textarea>
                </div>
            </fieldset>

            <button type="submit">Submit Poll</button>

        </form>
    </main>
    
    <footer>
        <p>©️2026 | HTML Form - User Poll Activity | Orere Emmanuel</p>
    </footer>

</body>
</html>
