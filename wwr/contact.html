<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Splash Water Rafting to book your next adventure, ask questions, or get assistance. We're here to help make your rafting experience unforgettable.">
    <meta name="author" content="Emmanuel Orere">
    <title>Contact Us | Splash Water Rafting</title>
    <link rel="stylesheet" href="styles/contact.css">
</head>
<body>
    <header class="split">
        <img src="images/z-splash.png" alt="WWR logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>    
    </header>

    <main>

        <h2>Splash Water Rafting</h2>
            <p>No.5 Onyeka Ikediashi Street</p> 
            <p>Asaba, Delta State</p>
            <p>+234 80 62064285</p>
            <p>info@splashrafting.com</p>

        <div class="hero">
            
            <div class="left">
                <!-- <img src="images/back-hero-image.jpg" alt="Ride the current"> -->
                 <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d797.0806761163875!2d6.706811244066841!3d6.222866326311798!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1785852687005!5m2!1sen!2sng" width="600px" height="450px"  allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            
            <form class="right">
                
                <div class="form-item">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="John Doe">
                </div>

                <div class="form-item">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="johndoe@mail.com">
                </div>

                <div class="radio1">
                    <label>Message Purpose</label>

                    <div class="radio-item">
                        <label><input type="radio" name="purpose" id="inquiry">General Inquiry</label>

                        <label><input type="radio" name="purpose" id="question">Reservation Question</label>

                        <label><input type="radio" name="purpose" id="suggestion">Website Suggestion</label>
                    </div>

                </div>
                
                <label for="message">Message</label>
                <textarea name="message" id="message" placeholder="Type here" rows="3"></textarea>

                <div class="form-item checkbox-span">
                    <input type="checkbox" id="sub" name="sub">
                    <label for="sub">Please Subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Get in Touch!</button>

            </form>
            
        </div>


        <section class="box">
            <h2>We Are Here to Serve You</h2>
            <div class="adventure">
                <figure>
                    <img src="images/adventure1.jpg" alt="Rafting Adventure">
                    <figcaption>Rubber Duck Run</figcaption>
                </figure>
                <figure>
                    <img src="images/adventure2.jpg" alt="Rafting Group">
                    <figcaption>Serpent's Coil</figcaption>
                </figure>
                <figure>
                    <img src="images/adventure3.jpg" alt="Yellow Rafting">
                    <figcaption>Silver Current</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>©️ 2026🌴Splash🌴Emmanuel Orere</p>
        <nav class="socialmedia">
                <a href="www.instagram.com"><img src="images/instagram-circle.png" alt="Instagram Icon"></a>
                <a href="www.facbook.com"><img src="images/facebook-circle.png" alt="Facebook Icon"></a>
                <a href="www.youtube.com"><img src="images/youtube-circle.png" alt="Youtube Icon"></a>    
        </nav>
    </footer>
</body>
</html>
